<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUCP Cloud Orchestrator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── LOGIN ─────────────────────────────────────────────── -->
  <div id="login-page">
    <div class="login-card">
      <div class="login-logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#1f6feb"/>
          <path d="M10 28 Q20 12 30 28" stroke="#58a6ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="28" r="3" fill="#58a6ff"/>
          <circle cx="20" cy="18" r="3" fill="#58a6ff"/>
          <circle cx="30" cy="28" r="3" fill="#58a6ff"/>
        </svg>
        <span>Cloud Orchestrator</span>
      </div>
      <p class="login-subtitle">PUCP — Virtual Network Research Testbed</p>
      <form id="login-form">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="inp-username" placeholder="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="inp-password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="btn-login">Ingresar</button>
        <p id="login-error" class="error-msg hidden"></p>
      </form>
    </div>
  </div>

  <!-- ── APP SHELL ─────────────────────────────────────────── -->
  <div id="app" class="hidden">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg width="24" height="24" viewBox="0 0 40 40" fill="none">
          <path d="M10 28 Q20 12 30 28" stroke="#58a6ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <circle cx="10" cy="28" r="3" fill="#58a6ff"/>
          <circle cx="20" cy="18" r="3" fill="#58a6ff"/>
          <circle cx="30" cy="28" r="3" fill="#58a6ff"/>
        </svg>
        <span>Cloud Orchestrator</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav"></nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <div class="user-info">
            <span class="user-name" id="user-name">—</span>
            <span class="role-badge" id="user-role-badge">—</span>
          </div>
        </div>
        <button class="btn-icon" id="btn-logout" title="Cerrar sesión">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <h1 id="topbar-title">Dashboard</h1>
      </header>
      <main id="content" class="content"></main>
    </div>

  </div>

  <!-- ── MODAL ─────────────────────────────────────────────── -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="btn-icon" id="btn-modal-close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- ── TOAST ─────────────────────────────────────────────── -->
  <div id="toast-container"></div>

  <!-- Módulos (scripts clásicos: comparten el ámbito global, el orden importa) -->
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/views/overview.js"></script>
  <script src="js/views/slices.js"></script>
  <script src="js/views/designer.js"></script>
  <script src="js/views/images.js"></script>
  <script src="js/views/infra.js"></script>
  <script src="js/views/networking.js"></script>
  <script src="js/views/users.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
