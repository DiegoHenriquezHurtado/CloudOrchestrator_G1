version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: orchestrator-db
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: orchestrator-auth
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: orchestrator-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth
    environment:
      - JWT_SECRET=supersecretkey_orchestrator
      - AUTH_URL=http://auth:8081/auth

  vm-placement:
    build: ./vm-placement
    container_name: vm-placement
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  image-manager:
    build:
      context: ./image-manager
      dockerfile: Dockerfile
    container_name: orchestrator-image-manager
    ports:
      - "8083:8083"
    environment:
      - IMAGE_BASE_PATH=/mnt/storage/base/
      - IMAGE_INSTANCES_PATH=/mnt/storage/instances/
    volumes:
      - /mnt/storage:/mnt/storage

  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: orchestrator-monitoring
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - SSH_ENABLED=true
    depends_on:
      - postgres
    volumes:
      - ~/.ssh:/root/.ssh:ro

  networking:
    build:
      context: ./networking
      dockerfile: Dockerfile
    container_name: orchestrator-networking
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  slice-manager:
    build:
      context: ./slice-manager
      dockerfile: Dockerfile
    container_name: orchestrator-slice-manager
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - IMAGE_MANAGER_URL=http://image-manager:8083
      - NETWORKING_URL=http://networking:8085
      - PLACEMENT_URL=http://vm-placement:8086
    depends_on:
      - postgres
      - image-manager
      - networking
      - vm-placement

  dispatcher:
    build:
      context: ./dispatcher
      dockerfile: Dockerfile
    container_name: orchestrator-dispatcher
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - DRIVER_URL=http://driver:8088
      - OPENSTACK_DRIVER_URL=http://openstack-driver:8089
      - NETWORKING_URL=http://networking:8085
      - POLL_INTERVAL_SECONDS=5
      - STALE_TIMEOUT_MINUTES=10
    depends_on:
      - postgres
      - driver
      - openstack-driver
      - networking

  driver:
    build:
      context: ./driver
      dockerfile: Dockerfile
    container_name: orchestrator-driver
    ports:
      - "8088:8088"
    environment:
      - NETWORKING_URL=http://networking:8085
      - SSH_ENABLED=true
      - SSH_BASTION_HOST=192.168.203.4
    depends_on:
      - networking
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - /mnt/storage:/mnt/storage

  openstack-driver:
    build:
      context: ./openstack-driver
      dockerfile: Dockerfile
    container_name: orchestrator-openstack-driver
    ports:
      - "8089:8089"
    environment:
      - ACCESS_NODE_IP=10.20.11.231
      - KEYSTONE_PORT=5000
      - NOVA_PORT=8774
      - NEUTRON_PORT=9696
      - GLANCE_PORT=9292
      - DOMAIN_ID=ff80f00b054f4c4abd3a00d3de1bf48f
      - ADMIN_PROJECT_ID=490934a931634a3ead678e446ec662d7
      - ADMIN_USER_ID=72d60bd76f254eed9c9ea9a86c35df48
      - ADMIN_USER_PASSWORD=66c5f106f03328bbb47bd5ec609c320e
      - ADMIN_ROLE_ID=6923937f568d47ccbb178d7b14fcd1a2
      - COMPUTE_API_VERSION=2.87
      - OS_PROVIDER_NETWORK_NAME=external
      - MOCK_MODE=false

volumes:
  pgdata:
