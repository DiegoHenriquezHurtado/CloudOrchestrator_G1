version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: orchestrator-db
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: orchestrator
      POSTGRES_DB: orchestrator_db
    ports:
      - "5432:5432"
    volumes:
      - ./db/init_schema.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: orchestrator-auth
    ports:
      - "8081:8081"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: orchestrator-gateway
    ports:
      - "8080:8080"
    depends_on:
      - auth
    environment:
      - JWT_SECRET=supersecretkey_orchestrator
      - AUTH_URL=http://auth:8081/auth

  vm-placement:
    build: ./vm-placement
    container_name: vm-placement
    ports:
      - "8086:8086"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  image-manager:
    build:
      context: ./image-manager
      dockerfile: Dockerfile
    container_name: orchestrator-image-manager
    ports:
      - "8083:8083"
    environment:
      - IMAGE_BASE_PATH=/mnt/storage/base/
      - IMAGE_INSTANCES_PATH=/mnt/storage/instances/
    volumes:
      - /mnt/storage:/mnt/storage

  monitoring:
    build:
      context: ./monitoring
      dockerfile: Dockerfile
    container_name: orchestrator-monitoring
    ports:
      - "8084:8084"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - SSH_ENABLED=true
    depends_on:
      - postgres
    volumes:
      - ~/.ssh:/root/.ssh:ro

  networking:
    build:
      context: ./networking
      dockerfile: Dockerfile
    container_name: orchestrator-networking
    ports:
      - "8085:8085"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
    depends_on:
      - postgres

  slice-manager:
    build:
      context: ./slice-manager
      dockerfile: Dockerfile
    container_name: orchestrator-slice-manager
    ports:
      - "8082:8082"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - IMAGE_MANAGER_URL=http://image-manager:8083
      - NETWORKING_URL=http://networking:8085
      - PLACEMENT_URL=http://vm-placement:8086
    depends_on:
      - postgres
      - image-manager
      - networking
      - vm-placement

  dispatcher:
    build:
      context: ./dispatcher
      dockerfile: Dockerfile
    container_name: orchestrator-dispatcher
    ports:
      - "8087:8087"
    environment:
      - DATABASE_URL=postgresql+asyncpg://orchestrator:orchestrator@postgres:5432/orchestrator_db
      - DRIVER_URL=http://driver:8088
      - NETWORKING_URL=http://networking:8085
      - POLL_INTERVAL_SECONDS=5
      - STALE_TIMEOUT_MINUTES=10
    depends_on:
      - postgres
      - driver
      - networking

  driver:
    build:
      context: ./driver
      dockerfile: Dockerfile
    container_name: orchestrator-driver
    ports:
      - "8088:8088"
    environment:
      - NETWORKING_URL=http://networking:8085
      - SSH_ENABLED=true
    depends_on:
      - networking
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - /mnt/storage:/mnt/storage

volumes:
  pgdata:
